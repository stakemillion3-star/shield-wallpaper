name: Update sports wallpaper
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generator.py
      - name: Commit updated wallpaper
        run: |
          git config user.name "shield-wallpaper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wallpaper.jpg
          git diff --cached --quiet || git commit -m "Update sports wallpaper"
          git push
