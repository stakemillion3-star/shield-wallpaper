name: Build Shield Sports Projectivy provider
on:
  push:
    paths:
      - "projectivy-provider/**"
      - ".github/workflows/build-projectivy-provider.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Get official Projectivy provider template
        run: git clone --depth 1 https://github.com/spocky/projectivy-plugin-wallpaper-provider.git "$RUNNER_TEMP/projectivy-provider"
      - name: Configure Shield Sports provider
        run: python3 projectivy-provider/prepare_provider.py "$RUNNER_TEMP/projectivy-provider"
      - name: Build Android TV APK
        working-directory: ${{ runner.temp }}/projectivy-provider
        run: ./gradlew :sample:assembleDebug --no-daemon
      - name: Publish APK in the repository
        run: |
          mkdir -p downloads
          cp "$RUNNER_TEMP/projectivy-provider/sample/build/outputs/apk/debug/sample-debug.apk" downloads/ShieldSportsLive.apk
          cp "$RUNNER_TEMP/projectivy-provider/LICENSE" downloads/Projectivy-Provider-Template-LICENSE.txt
          git config user.name "shield-wallpaper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/ShieldSportsLive.apk downloads/Projectivy-Provider-Template-LICENSE.txt
          git diff --cached --quiet || git commit -m "Publish Shield Sports Live Projectivy provider"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ShieldSportsLive-AndroidTV
          path: downloads/ShieldSportsLive.apk
          if-no-files-found: error
